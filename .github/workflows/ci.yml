name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck / build
        run: npm run build
        env:
          AUTH_SECRET: ci-build-secret-at-least-32-characters-long
          DATABASE_URL: postgresql://user:pass@localhost:5432/zerospoil?schema=public
          NEXT_PUBLIC_DEVELOPER_NAME: CI
          NEXT_PUBLIC_DEVELOPER_GITHUB: https://github.com/example
          NEXT_PUBLIC_DEVELOPER_LINKEDIN: https://www.linkedin.com/in/example
